<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Orbit Blaster</title>
<style>
  :root{--bg:#0b0b14;--fg:#e7e7f5;--accent:#22d3ee;--muted:#8b8ba7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
    -webkit-user-select:none;user-select:none;touch-action:none}
  h1{font-size:20px;letter-spacing:.04em}
  .wrap{width:min(92vw,480px)}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .score{background:#16162a;border:1px solid #2a2a44;border-radius:10px;padding:6px 12px;font-weight:700}
  canvas{width:100%;background:#16162a;border:1px solid #2a2a44;border-radius:14px;display:block;touch-action:none}
  .hint{color:var(--muted);font-size:13px;text-align:center}
  button{background:var(--accent);color:#04121a;border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>Orbit Blaster</h1><div class="score">Score: <span id="score">0</span> · Lives: <span id="lives">3</span></div></div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="hint">WASD / arrows to move, click or Space to fire. Destroy enemies.</div>
  <div style="text-align:center;margin-top:10px"><button id="restart">New Game</button></div>
</div>
<script>
const W=480,H=480;
let player,bullets,enemies,score,lives,over,fireT,spawnT,raf,keys,touchX;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');
function init(){
  player={x:W/2,y:H-46,w:36,h:22};
  bullets=[];enemies=[];score=0;lives=3;over=false;fireT=0;spawnT=0;
  keys={};touchX=null;scoreEl.textContent='0';livesEl.textContent='3';
  cancelAnimationFrame(raf);loop();
}
function loop(){
  if(!over)update();
  draw();if(!over)raf=requestAnimationFrame(loop);
}
function update(){
  const sp=4.2;
  if(keys['ArrowLeft']||keys['a'])player.x-=sp;
  if(keys['ArrowRight']||keys['d'])player.x+=sp;
  if(touchX!==null)player.x+=(touchX-player.x)*0.25;
  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
  fireT++;spawnT++;
  if(fireT>=14){fireT=0;bullets.push({x:player.x,y:player.y-14,vy:-8,r:4});}
  if(spawnT>=55){spawnT=0;enemies.push({x:20+Math.random()*(W-40),y:-20,vy:1.1+Math.random()*1.1,r:15,hp:1});}
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y+=b.vy;if(b.y<-10)bullets.splice(i,1);}
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.y+=e.vy;
    if(e.y>H+20){enemies.splice(i,1);lives--;livesEl.textContent=lives;if(lives<=0)over=true;continue;}
    for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){bullets.splice(j,1);e.hp--;if(e.hp<=0){enemies.splice(i,1);score+=20;scoreEl.textContent=score;}break;}}
    if(over)continue;
    if(Math.abs(e.x-player.x)<player.w/2+e.r&&Math.abs(e.y-player.y)<player.h/2+e.r){enemies.splice(i,1);lives--;livesEl.textContent=lives;if(lives<=0)over=true;}
  }
}
function draw(){
  ctx.fillStyle='#16162a';ctx.fillRect(0,0,W,H);
  bullets.forEach(b=>{ctx.fillStyle='#22d3ee';ctx.fillRect(b.x-2,b.y-6,4,12);});
  enemies.forEach(e=>{ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#0b0b14';ctx.beginPath();ctx.arc(e.x-4,e.y-3,3,0,7);ctx.arc(e.x+4,e.y-3,3,0,7);ctx.fill();});
  ctx.fillStyle='#34d399';ctx.beginPath();ctx.moveTo(player.x,player.y-player.h/2);ctx.lineTo(player.x-player.w/2,player.y+player.h/2);ctx.lineTo(player.x+player.w/2,player.y+player.h/2);ctx.closePath();ctx.fill();
  if(over){
    ctx.fillStyle='rgba(8,8,20,.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f43f5e';ctx.font='700 32px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Game Over',W/2,H/2-10);
    ctx.fillStyle='#e7e7f5';ctx.font='600 16px system-ui';ctx.fillText('Score '+score+' · tap New Game',W/2,H/2+24);
  }
}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key]=false;});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();const cx=(e.clientX-r.left)/r.width*W;player.x=cx;});
canvas.addEventListener('touchmove',e=>{const r=canvas.getBoundingClientRect();touchX=(e.touches[0].clientX-r.left)/r.width*W;e.preventDefault();},{passive:false});
canvas.addEventListener('touchstart',e=>{const r=canvas.getBoundingClientRect();touchX=(e.touches[0].clientX-r.left)/r.width*W;},{passive:true});
canvas.addEventListener('mousedown',()=>{keys[' ']=true;});
canvas.addEventListener('mouseup',()=>{keys[' ']=false;});
document.getElementById('restart').addEventListener('click',init);
init();
</script>
</body></html>
