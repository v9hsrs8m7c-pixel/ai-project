<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Bubble Pop</title>
<style>
  :root{--bg:#0b0b14;--fg:#e7e7f5;--accent:#9b6bff;--muted:#8b8ba7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
    -webkit-user-select:none;user-select:none;touch-action:none}
  h1{font-size:20px;letter-spacing:.04em}
  .wrap{width:min(92vw,480px)}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .score{background:#16162a;border:1px solid #2a2a44;border-radius:10px;padding:6px 12px;font-weight:700}
  canvas{width:100%;background:#16162a;border:1px solid #2a2a44;border-radius:14px;display:block;touch-action:none}
  .hint{color:var(--muted);font-size:13px;text-align:center}
  button{background:var(--accent);color:#0e0722;border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>Bubble Pop</h1><div class="score">Score: <span id="score">0</span></div></div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="hint">Aim with the mouse, click to shoot. Match 3+ same-color bubbles.</div>
  <div style="text-align:center;margin-top:10px"><button id="restart">New Game</button></div>
</div>
<script>
const W=480,H=480,R=19,D=38,COLS=12,MARGIN=12,TOP=42,ROWH=D*0.9;
const COLORS=['#22d3ee','#34d399','#fbbf24','#fb7185','#9b6bff'];
let grid,score,over,ball,aim,raf,shooter;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
function init(){
  grid=[];const rows=7;
  for(let r=0;r<rows;r++){const row=[];const cols=r%2?COLS-1:COLS;for(let c=0;c<cols;c++)row.push((Math.random()*COLORS.length)|0);grid.push(row);}
  score=0;over=false;scoreEl.textContent='0';
  shooter={x:W/2,y:H-34};
  aim={x:W/2,y:TOP};
  ball=null;
  newBall();cancelAnimationFrame(raf);loop();
}
function cellPos(r,c){
  const x=MARGIN+R+c*D+(r%2?D/2:0);
  const y=TOP+R+r*ROWH;
  return {x,y};
}
function newBall(){ball={color:(Math.random()*COLORS.length)|0,x:shooter.x,y:shooter.y,vx:0,vy:0,active:false};}
function neighbors(r,c){
  const e=[[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]];
  const o=[[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]];
  return (r%2?o:e).filter(([rr,cc])=>rr>=0&&rr<grid.length&&cc>=0&&cc<grid[rr].length);
}
function shoot(){
  if(!ball||ball.active||over)return;
  const dx=aim.x-shooter.x,dy=aim.y-shooter.y,len=Math.hypot(dx,dy)||1;
  const sp=8;
  ball.vx=dx/len*sp;ball.vy=dy/len*sp;ball.active=true;
}
function loop(){
  if(!over&&ball&&ball.active)step();
  draw();
  if(!over)raf=requestAnimationFrame(loop);
}
function step(){
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<R){ball.x=R;ball.vx*=-1;}
  if(ball.x>W-R){ball.x=W-R;ball.vx*=-1;}
  // top
  if(ball.y<R+TOP){snap();return;}
  // collide
  for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++){
    if(grid[r][c]<0)continue;
    const p=cellPos(r,c);
    if(Math.hypot(ball.x-p.x,ball.y-p.y)<D){snap();return;}
  }
  if(ball.y>H){newBall();}
}
function snap(){
  // find nearest empty cell
  let best=null,bd=1e9;
  for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++){
    if(grid[r][c]>=0)continue;
    const p=cellPos(r,c);const d=Math.hypot(ball.x-p.x,ball.y-p.y);
    if(d<bd){bd=d;best=[r,c];}
  }
  if(!best){ // expand grid
    grid.push(new Array(COLS).fill(-1));best=[grid.length-1,Math.min(COLS-1,(ball.x/D)|0)];
  }
  const [r,c]=best;grid[r][c]=ball.color;
  // match
  const cluster=[],seen=new Set();const stack=[[r,c]];
  while(stack.length){const [rr,cc]=stack.pop();const k=rr+','+cc;if(seen.has(k))continue;seen.add(k);if(grid[rr][cc]!==ball.color)continue;cluster.push([rr,cc]);for(const n of neighbors(rr,cc))if(grid[n[0]][n[1]]===ball.color)stack.push(n);}
  if(cluster.length>=3){
    cluster.forEach(([rr,cc])=>grid[rr][cc]=-1);
    score+=cluster.length*10;scoreEl.textContent=score;
    dropFloating();
  }
  // grow grid downward a row if top emptied (keep playable)
  if(grid[0].every(v=>v<0))grid.shift();
  // game over check
  for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++){
    if(grid[r][c]>=0){const p=cellPos(r,c);if(p.y+R>=shooter.y-30){over=true;}}
  }
  newBall();
}
function dropFloating(){
  const connected=new Set();const stack=[];
  for(let c=0;c<grid[0].length;c++)if(grid[0][c]>=0)stack.push([0,c]);
  while(stack.length){const [r,c]=stack.pop();const k=r+','+c;if(connected.has(k))continue;connected.add(k);for(const n of neighbors(r,c))if(grid[n[0]][n[1]]>=0)stack.push(n);}
  for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++)if(grid[r][c]>=0&&!connected.has(r+','+c)){grid[r][c]=-1;score+=5;scoreEl.textContent=score;}
}
function draw(){
  ctx.fillStyle='#16162a';ctx.fillRect(0,0,W,H);
  for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++){
    if(grid[r][c]<0)continue;const p=cellPos(r,c);
    ctx.fillStyle=COLORS[grid[r][c]];ctx.beginPath();ctx.arc(p.x,p.y,R-1,0,7);ctx.fill();
  }
  if(ball){ctx.fillStyle=COLORS[ball.color];ctx.beginPath();ctx.arc(ball.x,ball.y,R-1,0,7);ctx.fill();
    if(!ball.active){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();}}
  ctx.fillStyle='#e7e7f5';ctx.beginPath();ctx.arc(shooter.x,shooter.y,10,0,7);ctx.fill();
  if(over){
    ctx.fillStyle='rgba(8,8,20,.8)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f43f5e';ctx.font='700 32px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Game Over',W/2,H/2-10);
    ctx.fillStyle='#e7e7f5';ctx.font='600 16px system-ui';ctx.fillText('Score '+score+' · tap New Game',W/2,H/2+24);
  }
}
function setAim(e){const r=canvas.getBoundingClientRect();const cx=(e.clientX!==undefined?e.clientX:e.touches[0].clientX);const cy=(e.clientY!==undefined?e.clientY:e.touches[0].clientY);aim.x=(cx-r.left)/r.width*W;aim.y=(cy-r.top)/r.height*H;}
canvas.addEventListener('mousemove',setAim);
canvas.addEventListener('touchmove',e=>{setAim(e);e.preventDefault();},{passive:false});
canvas.addEventListener('mousedown',e=>{setAim(e);shoot();});
canvas.addEventListener('touchstart',e=>{setAim(e);shoot();e.preventDefault();},{passive:false});
document.getElementById('restart').addEventListener('click',init);
init();
</script>
</body></html>
