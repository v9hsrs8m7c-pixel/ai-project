<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇游戏</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #4ecca3;
      text-shadow: 0 0 10px #4ecca388;
      letter-spacing: 4px;
    }

    #score-board {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    #score-board span {
      color: #a8dadc;
    }

    #score-board b {
      color: #4ecca3;
    }

    #game-container {
      position: relative;
    }

    canvas {
      border: 3px solid #4ecca3;
      border-radius: 6px;
      box-shadow: 0 0 20px #4ecca344;
      background: #16213e;
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(22, 33, 62, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #4ecca3;
      margin-bottom: 1rem;
    }

    #overlay p {
      color: #a8dadc;
      margin-bottom: 0.4rem;
      font-size: 1rem;
    }

    button#start-btn {
      margin-top: 1.2rem;
      padding: 0.6rem 2rem;
      font-size: 1.1rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button#start-btn:hover {
      background: #38b2ac;
    }

    #controls {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #6b8caf;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>

  <div id="score-board">
    <span>得分：<b id="score">0</b></span>
    <span>最高分：<b id="best">0</b></span>
    <span>级别：<b id="level">1</b></span>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="400" height="400"></canvas>

    <div id="overlay">
      <h2 id="overlay-title">贪吃蛇</h2>
      <p>使用 ↑ ↓ ← → 或 W A S D 控制方向</p>
      <p>吃到食物得分，速度随级别提升</p>
      <button id="start-btn">开始游戏</button>
    </div>
  </div>

  <div id="controls">按 P 暂停 / 继续 &nbsp;|&nbsp; 按 R 重新开始</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelEl = document.getElementById('level');

    const COLS = 20;
    const ROWS = 20;
    const CELL = canvas.width / COLS;

    const COLORS = {
      head: '#4ecca3',
      body: '#3ab89a',
      food: '#e94560',
      grid: '#1e2d4a',
    };

    let snake, dir, nextDir, food, score, best, level, speed, gameLoop, running, paused;

    best = parseInt(localStorage.getItem('snakeBest') || '0');
    bestEl.textContent = best;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      speed = 150;
      scoreEl.textContent = 0;
      levelEl.textContent = 1;
      spawnFood();
    }

    function spawnFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function drawGrid() {
      ctx.fillStyle = COLORS.grid;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if ((r + c) % 2 === 0) {
            ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
          }
        }
      }
    }

    function drawSnake() {
      snake.forEach((seg, i) => {
        const radius = i === 0 ? 5 : 3;
        ctx.fillStyle = i === 0 ? COLORS.head : COLORS.body;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, radius);
        ctx.fill();

        if (i === 0) {
          // draw eyes
          const eyeSize = 3;
          ctx.fillStyle = '#1a1a2e';
          const cx = seg.x * CELL + CELL / 2;
          const cy = seg.y * CELL + CELL / 2;
          const ex = dir.x * 5;
          const ey = dir.y * 5;
          const perp = { x: -dir.y, y: dir.x };
          ctx.beginPath();
          ctx.arc(cx + ex + perp.x * 4, cy + ey + perp.y * 4, eyeSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx + ex - perp.x * 4, cy + ey - perp.y * 4, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawFood() {
      const x = food.x * CELL + CELL / 2;
      const y = food.y * CELL + CELL / 2;
      const r = CELL / 2 - 3;
      ctx.fillStyle = COLORS.food;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // shine
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      if (food) drawFood();
      if (snake) drawSnake();
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }

      // self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10 * level;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snakeBest', best);
        }
        const newLevel = Math.floor(score / 100) + 1;
        if (newLevel !== level) {
          level = newLevel;
          levelEl.textContent = level;
          speed = Math.max(60, 150 - (level - 1) * 15);
          restartLoop();
        }
        spawnFood();
      } else {
        snake.pop();
      }

      render();
    }

    function restartLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(step, speed);
    }

    function startGame() {
      init();
      overlay.style.display = 'none';
      running = true;
      paused = false;
      render();
      restartLoop();
    }

    function gameOver() {
      clearInterval(gameLoop);
      running = false;
      overlayTitle.textContent = '游戏结束';
      startBtn.textContent = '再玩一次';
      overlay.style.display = 'flex';
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        clearInterval(gameLoop);
        overlayTitle.textContent = '已暂停';
        startBtn.textContent = '继续游戏';
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
        restartLoop();
      }
    }

    startBtn.addEventListener('click', startGame);

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (dir.y !== 1) nextDir = { x: 0, y: -1 };
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (dir.y !== -1) nextDir = { x: 0, y: 1 };
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (dir.x !== 1) nextDir = { x: -1, y: 0 };
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (dir.x !== -1) nextDir = { x: 1, y: 0 };
          break;
        case 'p':
        case 'P':
          togglePause();
          break;
        case 'r':
        case 'R':
          startGame();
          break;
      }

      // prevent page scroll on arrow keys
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
      }
    });

    // touch / swipe support for mobile
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 10 && dir.x !== -1) nextDir = { x: 1, y: 0 };
        else if (dx < -10 && dir.x !== 1) nextDir = { x: -1, y: 0 };
      } else {
        if (dy > 10 && dir.y !== -1) nextDir = { x: 0, y: 1 };
        else if (dy < -10 && dir.y !== 1) nextDir = { x: 0, y: -1 };
      }
      e.preventDefault();
    }, { passive: false });

    render();
  </script>
</body>
</html>
