<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 游戏头部 -->
        <header class="game-header">
            <h1 class="game-title">🐍 贪吃蛇</h1>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">得分</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">最高分</span>
                    <span id="highScore" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <!-- 游戏主区域 -->
        <main class="game-main">
            <canvas id="gameCanvas"></canvas>
            
            <!-- 开始界面 -->
            <div id="startScreen" class="overlay">
                <div class="overlay-content">
                    <h2>🐍 贪吃蛇</h2>
                    <p>使用方向键或触摸控制</p>
                    <button id="startBtn" class="btn btn-primary">开始游戏</button>
                </div>
            </div>

            <!-- 暂停界面 -->
            <div id="pauseScreen" class="overlay hidden">
                <div class="overlay-content">
                    <h2>⏸️ 暂停</h2>
                    <button id="resumeBtn" class="btn btn-primary">继续游戏</button>
                </div>
            </div>

            <!-- 游戏结束界面 -->
            <div id="gameOverScreen" class="overlay hidden">
                <div class="overlay-content">
                    <h2>💀 游戏结束</h2>
                    <p>最终得分: <span id="finalScore">0</span></p>
                    <button id="restartBtn" class="btn btn-primary">重新开始</button>
                </div>
            </div>
        </main>

        <!-- 移动端控制按钮 -->
        <div class="mobile-controls">
            <div class="control-row">
                <button id="upBtn" class="control-btn">⬆️</button>
            </div>
            <div class="control-row">
                <button id="leftBtn" class="control-btn">⬅️</button>
                <button id="pauseBtn" class="control-btn pause">⏸️</button>
                <button id="rightBtn" class="control-btn">➡️</button>
            </div>
            <div class="control-row">
                <button id="downBtn" class="control-btn">⬇️</button>
            </div>
        </div>

        <!-- 底部提示 -->
        <footer class="game-footer">
            <p>💡 提示: 按空格键暂停/继续 | 方向键控制移动</p>
        </footer>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
