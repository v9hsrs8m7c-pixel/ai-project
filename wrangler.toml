name = "darlynmae-game-portal"
main = ".open-next/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Static assets emitted by `opennextjs-cloudflare build`.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# OpenNext incremental cache. Create a KV namespace in the Cloudflare
# dashboard and paste its ID below, then bind it in Pages settings as NEXT_CACHE.
# Required for production caching; the local build works without it.
[[kv_namespaces]]
binding = "NEXT_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
